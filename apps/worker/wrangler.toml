name = "emenda-pl"
main = "../../crates/worker/build/index.js"
compatibility_date = "2026-10-01"
# Custom domains (zone emenda.online). workers.dev stays enabled for testing (/v1 on any host).
routes = [
  { pattern = "emenda.online", custom_domain = true },
  { pattern = "api.emenda.online", custom_domain = true },
]
workers_dev = true

[build]
command = "cd ../../crates/worker && worker-build --release"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/", "/api/*", "/data/*", "/og/*", "/v1", "/v1/*",
  "/deputado/*", "/senador/*", "/municipio/*", "/uf/*",
  "/autor/*", "/proposicao/*", "/votacao/*", "/partido/*",
]

[vars]
# Empty -> /data/* served from ASSETS (apps/web/dist/data); local dev: --var DATA_BASE_URL:""
DATA_BASE_URL = "https://raw.githubusercontent.com/kleeedolinux/emenda.pl/data/"
# ANALYTICS_SALT: set as a secret (`wrangler secret put ANALYTICS_SALT`) in production.

[[durable_objects.bindings]]
name = "ANALYTICS"
class_name = "Analytics"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Analytics"]

# Public API rate limits (per client IP, CF-Connecting-IP). Period must be 10 or 60.
# API_RL: every /v1 request (cache hits included). API_RL_MISS: cache misses only.
[[ratelimits]]
name = "API_RL"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "API_RL_MISS"
namespace_id = "1002"
simple = { limit = 60, period = 10 }
