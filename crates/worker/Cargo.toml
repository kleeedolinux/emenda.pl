[package]
name = "emenda-worker"
version = "0.10.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Júlia Klee <https://x.com/klee00z>"]
publish = false

[lib]
name = "emenda_worker"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
og = { path = "../og" }
getrandom = { version = "0.2", features = ["js"] }
