[package]
name = "etl"
version = "0.10.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Júlia Klee <onmikron@gmail.com>"]
description = "ETL: dados abertos de emendas parlamentares -> JSON estático (contrato v1)"

[[bin]]
name = "emenda-etl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
