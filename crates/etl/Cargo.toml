[package]
name = "etl"
version = "0.10.0"
edition = "2021"
default-run = "emenda-etl"
license = "GPL-3.0-only"
authors = ["Júlia Klee <onmikron@gmail.com>"]
description = "ETL: dados abertos de emendas parlamentares -> JSON estático (contrato v1)"

[[bin]]
name = "emenda-etl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
encoding_rs = "0.8"
resvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
webp = { version = "0.3", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
